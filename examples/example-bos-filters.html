<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Filtered Category Example</title>
  <link rel="stylesheet" href="./style.css" />
  
</head>
<body>
  <script type="module">
import * as ARA3D from '../src/index';
import { showFilter } from './filterPanel.js';
import * as THREE from 'three';

async function runExample() {
    const viewer = new ARA3D.Viewer({ fileDrop: { enable: false } });
    const loader = new ARA3D.BimOpenSchemaLoader();
    console.time('Loading .bos file');
    const bimData = await loader.load('/ara3d-webgl/Snowdon Towers Sample Architectural.bos');
    console.timeEnd('Loading .bos file');

    let group = bimData.ThreeGeometry;
    viewer.add(group);

    const catToInstances = bimData.Query.CategoryToInstances();

    let first = true;

    function updateVisible(map) {
        if (first)
        {
            first = false;
            return;
        }
        const instances = [];
        const ghostMaterial = new THREE.MeshStandardMaterial({
            color: 0x88aaff,
            transparent: true,
            opacity: 0.1,
            roughness: 0.8,
            metalness: 0.0,
            depthWrite: false,
        });
        for (let [ name, checked ] of map)
        {
            const list = catToInstances.get(name);
            if (!list) continue;
            if (checked)
            {
                for (let i = 0; i < list.length; i++) 
                    instances.push(list[i]);
            }
            else
            {
                for (let i = 0; i < list.length; i++) {
                    const instance = { ...list[i], material: ghostMaterial };
                    instances.push(instance);
                }
            }
        }
        const newGroup = bimData.rebuildGeometry(instances);
        viewer.remove(group);
        group = newGroup;
        viewer.add(group);
    }

    console.time("Creating filter");
    showFilter(
        'Category',
        catToInstances,
       (keys, map) => updateVisible(map)
    );
    console.timeEnd("Creating filter");
}

runExample();
  </script> 
</body>
</html>
