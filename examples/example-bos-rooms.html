<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Room + DataGrid + Gradient Chooser</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <script type="module">
    import * as ARA3D from "../src/index";
    import { showParameterGrid } from "./parameterGrid.js";
    import { showGradientChooser } from "./gradientChooser.js";
    import * as THREE from "three";

    async function runExample() 
    {
      const viewer = new ARA3D.Viewer();
      const loader = new ARA3D.BimOpenSchemaLoader();

      console.time("Loading .bos file");
      const bimData = await loader.load(
        "/ara3d-webgl/Snowdon Towers Sample Architectural.bos",
        { loadParameters: true }
      );
      console.timeEnd("Loading .bos file");

      const instances = bimData.Instances;
      const r = bimData.Resolver;

      // ---- Mark room visibility + collect room instances ----
      const roomInstances = [];
      const roomByEntity = new Map();

      for (const inst of instances) {
        inst.visible = r.GetInstanceCategoryName(inst) === "Rooms";
        if (inst.visible) {
          roomInstances.push(inst);
          roomByEntity.set(inst.entity, inst);
        }
      }

      // ---- Build parameter name list for rooms ----
      const paramNameSet = new Set();
      for (const inst of roomInstances) {
        const params = r.ParameterMap.get(inst.entity) ?? [];
        for (const p of params) {
          if (p?.Name != null) paramNameSet.add(String(p.Name));
        }
      }
      const parameterNames = Array.from(paramNameSet).sort((a, b) => a.localeCompare(b));

      // ---- Viewer geometry group management (rebuild on demand) ----
      let currentGroup = null;

      function rebuild() {
        const newGroup = bimData.rebuildGeometry(instances);

        if (currentGroup) {
          // Replace in viewer (Viewer API varies; remove from scene if needed)
          // If viewer exposes remove(), use it. Otherwise, remove directly from scene if accessible.
          if (typeof viewer.remove === "function") viewer.remove(currentGroup);
          else if (viewer.scene && typeof viewer.scene.remove === "function") viewer.scene.remove(currentGroup);
        }

        currentGroup = newGroup;
        viewer.add(currentGroup);
      }

      // Initial build
      rebuild();

      // ---- Material creation + caching ----
      // We create per-color materials and reuse them.
      const materialCache = new Map(); // key: hex color "#RRGGBB" -> THREE.Material

      function getMaterialForColor(hexColor) {
        const key = String(hexColor);
        let m = materialCache.get(key);
        if (!m) {
          m = new THREE.MeshStandardMaterial({
            color: new THREE.Color(key),
            roughness: 0.85,
            metalness: 0.0,
            flatShading: true,
          });
          materialCache.set(key, m);
        }
        return m;
      }

      // Apply colors to all visible room instances using values array aligned to roomInstances order
      function applyRoomColors(values, mapValueToColor) {
        for (let i = 0; i < roomInstances.length; i++) {
          const inst = roomInstances[i];
          const v = values[i];
          const color = mapValueToColor(v);
          inst.material = getMaterialForColor(color);
        }
        rebuild();
      }

      // Helper: get a value for a parameter from a room entity
      function getRoomParamValue(entity, parameterName) {
        const params = r.ParameterMap.get(entity) ?? [];
        const p = params.find(x => String(x.Name) === parameterName);
        return p?.Value ?? null;
      }

      // Helper required by gradient chooser: values aligned to roomInstances order
      function getValuesForParameter(parameterName) {
        return roomInstances.map(inst => {
          if (parameterName === "RoomName") return r.GetInstanceName(inst) ?? "";
          return getRoomParamValue(inst.entity, parameterName);
        });
      }

      console.log("Showing parameter grid");      
      const { table, _ } = await showParameterGrid({
        instances,
        resolver: r,
        panelTitle: "Room Parameters",
        panelWidthPx: 560,
      });

      table.on("cellEdited", function(e, row) { 
        // TODO: commit the data to para
      });

      // ---- Gradient chooser integration ----
      showGradientChooser({
        parameterNames: ["RoomName", ...parameterNames],
        getValuesForParameter,
        onChange: ({ parameterName, mapValueToColor, mode, order }) => {
          const values = getValuesForParameter(parameterName);
          console.log("Color by:", parameterName, "mode:", mode, "order:", order);
          applyRoomColors(values, mapValueToColor);
        },
        title: "Color Rooms",
      });
    }

    runExample();
  </script>
</body>
</html>
