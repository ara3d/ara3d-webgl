<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ara 3D WebGL Viewer Examples</title>
  
  <script type="module" crossorigin src="/ara3d-webgl/assets/input.b5f25efb.js"></script>
  <link rel="modulepreload" crossorigin href="/ara3d-webgl/assets/bvhPrecompute.worker.858fae95.js">
  <link rel="modulepreload" crossorigin href="/ara3d-webgl/assets/gltfLoader.878a4265.js">
  <link rel="modulepreload" crossorigin href="/ara3d-webgl/assets/bimOpenSchemaLoader.cde4167e.js">
  <link rel="stylesheet" href="/ara3d-webgl/assets/bvhPrecompute.c4c15feb.css">
</head>
<body>
<div id="sidebar">
  <h1>Examples</h1>
  <ul id="exampleList">
    <li><a href="./example-bos.html" target="exampleFrame">BIM Open Schema (BOS) Example</a></li>
    <li><a href="./example-bos-filters.html" target="exampleFrame">Filtered BOS Example</a></li>
    <li><a href="./example-bos-level-colors.html" target="exampleFrame">BOS Colors Example</a></li>
    <li><a href="./example-bos-selection.html" target="exampleFrame">BOS Selection Example</a></li>
    <li><a href="./example-bos-selection-shader.html" target="exampleFrame">BOS Selection Shader Tuning</a></li>
    <li><a href="./example-geometry.html" target="exampleFrame">Geometry Example</a></li>
    <li><a href="./example-gltf-duck.html" target="exampleFrame">GLTF Duck Example</a></li>
  </ul>
</div>

<div id="main">
  <iframe id="exampleFrame" name="exampleFrame" src="./example-bos.html"></iframe>
</div>

<!-- JavaScript to highlight the active link -->
<script>
  // Grab the iframe and all links in the sidebar
  const exampleFrame = document.getElementById('exampleFrame');
  const links = document.querySelectorAll('#exampleList a');

  // A helper function to remove "active" from all links,
  // then add it to the link whose href matches the loaded page
  function setActiveLink(href) {
    links.forEach(link => {
      link.classList.remove('active');
      // If the link's href ends with the same name as the iframe's loaded page,
      // we'll add the "active" class to highlight it.
      if (link.getAttribute('href') === href) {
        link.classList.add('active');
      }
    });
  }

  // 1) Set the highlight for the default page (example-basic.html)
  setActiveLink('example-bos.html');

  // 2) Whenever the iframe finishes loading a page,
  //    compare the loaded page’s filename with the sidebar links
  exampleFrame.addEventListener('load', () => {
    // For local files, we can split on '/' and take the last part
    const currentUrl = exampleFrame.contentWindow.location.href.split('/').pop();
    setActiveLink(currentUrl);
  });
</script>

</body>
</html>
