<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basic Example</title>
  <link rel="stylesheet" href="./style.css" />
  
</head>
<body>
  <script type="module">
import * as ARA3D from '../src/index';
import { showFilter } from './filterPanel.js';


async function runExample() {
    const viewer = new ARA3D.Viewer();
    const loader = new ARA3D.BimOpenSchemaLoader();

    console.time('Loading .bos file');
    const bimData = await loader.load(
        '/ara3d-webgl/rac_basic_sample_project-2025.bos'
    );
    // const bimData = await loader.load('/ara3d-webgl/snowdon.bos');
    console.timeEnd('Loading .bos file');

    let group = bimData.ThreeGeometry;
    viewer.add(group);

    const catToInstances = bimData.Query.CategoryToInstances();

    let first = true;

    function updateVisible(map) {
        if (first)
        {
            first = false;
            return;
        }
        const instances = [];
        for (let [ name, checked ] of map)
        {
            if (checked)
            {
                instances.push(...catToInstances.get(name));
            }
        }
        const newGroup = bimData.rebuildGeometry(instances);
        viewer.remove(group);
        group = newGroup;
        viewer.add(group);
    }

    showFilter(
        'Category',
        catToInstances,
       (keys, map) => updateVisible(map)
    );
}

runExample();
  </script> 
</body>
</html>
