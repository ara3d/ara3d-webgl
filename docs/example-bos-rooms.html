<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Rooms Demo + Grid + Gradient</title>
  
  <style>
    /* Full-screen split layout */
    html, body { height: 100%; margin: 0; }
    #app {
      position: fixed; inset: 0;
      display: flex; flex-direction: row;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 10;
      background: #fff;
    }
    #leftPane {
      flex: 1 1 auto;
      min-width: 320px;
      position: relative;
      overflow: hidden;
      background: #111;
    }
    #rightPane {
      width: 560px;
      min-width: 360px;
      max-width: 75vw;
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(0,0,0,0.12);
      background: #fff;
      overflow: hidden;
    }
    #divider {
      width: 8px;
      cursor: col-resize;
      background: linear-gradient(to right, rgba(0,0,0,0.03), rgba(0,0,0,0.10), rgba(0,0,0,0.03));
      user-select: none;
      touch-action: none;
    }
    /* grid host should fill right pane */
    #gridHost {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    /* Make Ara canvas fill */
    .ara3d-canvas, canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

  </style>
  <script type="module" crossorigin src="/ara3d-webgl/assets/exampleBosRooms.5d37518f.js"></script>
  <link rel="modulepreload" crossorigin href="/ara3d-webgl/assets/compressors.8dce4834.js">
  <link rel="modulepreload" crossorigin href="/ara3d-webgl/assets/bimOpenSchemaLoader.ad41252a.js">
  <link rel="modulepreload" crossorigin href="/ara3d-webgl/assets/DataTable.080f84a9.js">
  <link rel="stylesheet" href="/ara3d-webgl/assets/compressors.0c36277a.css">
</head>
<body>
  <!-- Split layout container -->
  <div id="app">
    <div id="leftPane"></div>
    <div id="divider"></div>
    <div id="rightPane">
      <div id="gridHost"></div>
    </div>
  </div>

  
</body>
</html>
