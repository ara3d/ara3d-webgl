<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Basic Example</title>
  
  <style>
    /* Simple overlay controls */
    .ui {
      position: fixed;
      top: 12px;
      left: 12px;
      z-index: 9999;
      background: rgba(20,20,20,0.85);
      color: #fff;
      padding: 12px 12px 10px;
      border-radius: 10px;
      font: 12px/1.2 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      min-width: 260px;
      user-select: none;
    }
    .ui h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; }
    .row { display: grid; grid-template-columns: 90px 1fr 50px; gap: 8px; align-items: center; margin: 6px 0; }
    .row label { opacity: 0.9; }
    .row input[type="range"] { width: 100%; }
    .val { text-align: right; opacity: 0.9; font-variant-numeric: tabular-nums; }
    .btns { display: flex; gap: 8px; margin-top: 8px; }
    button {
      background: #2b6cb0;
      border: 0;
      color: white;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    button:active { transform: translateY(1px); }
  </style>
  <script type="module" crossorigin src="/ara3d-webgl/assets/exampleBosLevelColors.2e7df632.js"></script>
  <link rel="modulepreload" crossorigin href="/ara3d-webgl/assets/compressors.5793b060.js">
  <link rel="modulepreload" crossorigin href="/ara3d-webgl/assets/bimOpenSchemaLoader.4bddc573.js">
  <link rel="stylesheet" href="/ara3d-webgl/assets/compressors.0c36277a.css">
</head>
<body>
  <div class="ui" id="ui">
    <h3>Palette Controls</h3>

    <div class="row">
      <label for="sat">Saturation</label>
      <input id="sat" type="range" min="0" max="1" step="0.01" value="0.45">
      <div class="val" id="satVal">0.45</div>
    </div>

    <div class="row">
      <label for="lit">Lightness</label>
      <input id="lit" type="range" min="0" max="1" step="0.01" value="0.20">
      <div class="val" id="litVal">0.20</div>
    </div>

    <div class="row">
      <label for="seed">Seed Hue</label>
      <input id="seed" type="range" min="0" max="1" step="0.001" value="0.10">
      <div class="val" id="seedVal">0.100</div>
    </div>

    <div class="btns">
      <button id="shuffle">Shuffle</button>
      <button id="reset">Reset</button>
    </div>
  </div>

  
</body>
</html>
