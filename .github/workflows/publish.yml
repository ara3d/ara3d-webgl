name: Publish Package (@yschindel)

on:
    workflow_dispatch: # Manual trigger from any branch
        inputs:
            branch:
                description: 'Branch to publish from'
                required: false
                default: ''
    push:
        tags:
            - 'v*' # Also trigger on version tags (optional)

permissions:
    id-token: write # Required for OIDC
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  ref: ${{ github.event.inputs.branch || github.ref }}

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'
                  registry-url: 'https://registry.npmjs.org'

            - name: Upgrade npm (required 11.5.1+ for OIDC)
              run: npm install -g npm@latest

            - name: Verify npm version and OIDC support
              run: |
                  npm --version
                  echo "NPM version check: $(npm --version | cut -d. -f1)"
                  if [ "$(npm --version | cut -d. -f1)" -lt 11 ]; then
                    echo "ERROR: npm version must be 11.5.1+ for OIDC"
                    exit 1
                  fi

            - name: Clear npm config that might interfere
              run: |
                  npm config delete always-auth || true
                  npm config delete _auth || true
                  npm config delete _authToken || true

            - name: Verify OIDC environment
              run: |
                  echo "Checking OIDC environment variables:"
                  [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo "✓ ACTIONS_ID_TOKEN_REQUEST_URL is set" || echo "✗ ACTIONS_ID_TOKEN_REQUEST_URL is NOT set"
                  [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ] && echo "✓ ACTIONS_ID_TOKEN_REQUEST_TOKEN is set" || echo "✗ ACTIONS_ID_TOKEN_REQUEST_TOKEN is NOT set"
                  echo ""
                  echo "GitHub Context:"
                  echo "Repository: ${{ github.repository }}"
                  echo "Workflow: ${{ github.workflow }}"
                  echo "Branch: $(git branch --show-current)"
                  echo "Commit: $(git rev-parse HEAD)"

            - name: Verify package.json scope
              run: |
                  PACKAGE_NAME=$(node -p "require('./package.json').name")
                  echo "Publishing package: $PACKAGE_NAME"
                  if [[ ! "$PACKAGE_NAME" =~ ^@yschindel/ ]]; then
                    echo "⚠ WARNING: Package name is $PACKAGE_NAME, expected @yschindel/*"
                    echo "This workflow is configured for @yschindel scope"
                  fi

            - name: Check if package exists on npm
              run: |
                  if npm view @yschindel/ara3d-webgl@latest version 2>/dev/null; then
                    echo "✓ Package exists on npm"
                    npm view @yschindel/ara3d-webgl versions --json
                  else
                    echo "⚠ Package does not exist on npm (this will be the first publish)"
                  fi
              continue-on-error: true

            - name: Install dependencies
              run: npm ci

            - name: Build package
              run: npm run build:lib

            - name: Publish to npm
              run: npm publish --access public --provenance
