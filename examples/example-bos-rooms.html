<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ara 3D Rooms + Grid + Gradient</title>
  <link rel="stylesheet" href="./style.css" />
  <style>
    /* Full-screen split layout */
    html, body { height: 100%; margin: 0; }
    #app {
      position: fixed; inset: 0;
      display: flex; flex-direction: row;
      overflow: hidden;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #fff;
    }
    #leftPane {
      flex: 1 1 auto;
      min-width: 320px;
      position: relative;
      overflow: hidden;
      background: #111;
    }
    #rightPane {
      width: 560px;
      min-width: 360px;
      max-width: 75vw;
      display: flex;
      flex-direction: column;
      border-left: 1px solid rgba(0,0,0,0.12);
      background: #fff;
      overflow: hidden;
    }
    #divider {
      width: 8px;
      cursor: col-resize;
      background: linear-gradient(to right, rgba(0,0,0,0.03), rgba(0,0,0,0.10), rgba(0,0,0,0.03));
      user-select: none;
      touch-action: none;
    }
    /* grid host should fill right pane */
    #gridHost {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }
    /* Make Ara canvas fill */
    .ara3d-canvas, canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <!-- Split layout container -->
  <div id="app">
    <div id="leftPane"></div>
    <div id="divider"></div>
    <div id="rightPane">
      <div id="gridHost"></div>
    </div>
  </div>

  <script type="module">
    import * as ARA3D from "../src/index";
    import { showParameterGrid } from "./parameterGrid.js";  
    import { showGradientChooser } from "./gradientChooser.js";
    import * as THREE from "three";

    function setupDividerResize() {
      const app = document.getElementById("app");
      const right = document.getElementById("rightPane");
      const divider = document.getElementById("divider");

      let dragging = false;
      divider.addEventListener("pointerdown", (e) => {
        dragging = true;
        divider.setPointerCapture(e.pointerId);
        e.preventDefault();
      });

      divider.addEventListener("pointermove", (e) => {
        if (!dragging) return;
        const totalW = app.getBoundingClientRect().width;
        const x = e.clientX;
        const rightW = Math.max(360, Math.min(totalW * 0.75, totalW - x));
        right.style.width = `${rightW}px`;
      });

      divider.addEventListener("pointerup", (e) => {
        dragging = false;
        try { divider.releasePointerCapture(e.pointerId); } catch {}
      });
    }
    
    function createGeometryOutline(
        geometry,
        {
            color = 0x000000,
            linewidth = 1,
            thresholdAngle = 1,
        } = {}
        ) {
        // Extract visible edges
        const edges = new THREE.EdgesGeometry(geometry, thresholdAngle);

        const material = new THREE.LineBasicMaterial({
            color,
            linewidth,
            depthTest: true,
            transparent: true,
        });

        const outline = new THREE.LineSegments(edges, material);
        outline.frustumCulled = false;

        return outline;
    }

    async function runExample() {
      setupDividerResize();

      const leftPane = document.getElementById("leftPane");
      const gridHost = document.getElementById("gridHost");

      const viewer = new ARA3D.Viewer();

      const canvas = document.querySelector(".ara3d-canvas");
      leftPane.appendChild(canvas);

      const loader = new ARA3D.BimOpenSchemaLoader();

      const bimData = await loader.load(
        "/ara3d-webgl/Snowdon Towers Sample Architectural.bos",
        { loadParameters: true }
      );

      const instances = bimData.Instances;
      const r = bimData.Resolver;

      const roomInstances = [];
      for (const inst of instances) {
        inst.visible = r.GetInstanceCategoryName(inst) === "Rooms";
        if (inst.visible) roomInstances.push(inst);
      }

      let currentGroup = null;
      function rebuild() {
        const newGroup = bimData.rebuildGeometry(instances);
        if (currentGroup) {
          if (typeof viewer.remove === "function") viewer.remove(currentGroup);
          else if (viewer.scene && typeof viewer.scene.remove === "function") viewer.scene.remove(currentGroup);
        }
        currentGroup = newGroup;
        viewer.add(currentGroup);
      }

      const materialCache = new Map(); 
      function getMaterialForColor(hexColor) {
        const key = String(hexColor);
        let m = materialCache.get(key);
        if (!m) {
          m = new THREE.MeshStandardMaterial({
            color: new THREE.Color(key),
            roughness: 0.85,
            metalness: 0.0,
            flatShading: true,
          });
          materialCache.set(key, m);
        }
        return m;
      }

      function applyRoomColors(values, mapValueToColor) {
        for (let i = 0; i < roomInstances.length; i++) {
          const inst = roomInstances[i];
          const v = values[i];
          const color = mapValueToColor(v);
          inst.material = getMaterialForColor(color);
        }
        rebuild();
      }

      // --------------------------------------------------------------------
      // Build a DataTable from room parameters
      // --------------------------------------------------------------------
      const roomTable = new ARA3D.DataTable();
      roomTable.exportNullForMissing = true;

      roomTable.ensureColumn("__entity"); // stable id (recommended)
      roomTable.ensureColumn("RoomName");

      // Map entity -> rowIndex for stable edits even with sorting/filtering
      const entityToRowIndex = new Map();

      for (const inst of roomInstances) {
        const entityKey = inst.entity;
        const params = r.ParameterMap.get(inst.entity) ?? [];

        const names = ["__entity", "RoomName"];
        const values = [entityKey, (r.GetInstanceName(inst) ?? "")];

        for (const p of params) {
          if (!p?.Name) continue;
          names.push(String(p.Name));
          values.push(p.Value);
        }

        const rowIndex = roomTable.addRowFromNamesAndValues(names, values);
        entityToRowIndex.set(entityKey, rowIndex);
      }

      function getValuesForParameter(parameterName) {
        const col = roomTable.tryGetColumnFromName(parameterName);
        if (!col) return roomInstances.map(_ => null);
        return col.slice(); 
      }

      const parameterNames = roomTable
        .getColumnNames()
        .filter(n => n !== "__entity" && n !== "RoomName")
        .sort((a, b) => a.localeCompare(b));

      // --------------------------------------------------------------------
      // Color state + refresh helper
      // --------------------------------------------------------------------
      let currentColoring = {
        parameterName: "RoomName",
        mapValueToColor: (v) => "#808080",
      };

      function refreshColorsFromCurrentChoice() {
        const values = getValuesForParameter(currentColoring.parameterName);
        applyRoomColors(values, currentColoring.mapValueToColor);
      }

      // --------------------------------------------------------------------
      // Show parameter grid (right side), driven by DataTable
      // --------------------------------------------------------------------      
        const pinnedFirst = ["RoomName"];
        const pinnedSet = new Set(pinnedFirst);

        const colNames = roomTable.getColumnNames();
        const orderedColNames = [
        ...pinnedFirst.filter(c => colNames.includes(c)),
        ...colNames
            .filter(c => !pinnedSet.has(c))
            .sort((a, b) => a.localeCompare(b)),
        ];
        roomTable.reorderColumns(orderedColNames);
        
        const grid = await showParameterGrid({
            host: gridHost,
            dataTable: roomTable,
            title: "Room Parameters",
            frozenColumns: ["RoomName"],
            hiddenColumns: ["__entity"],

            // IMPORTANT: use stable row key if your grid allows sorting/filtering.
            // Our generic grid callback gives rowIndex based on current position,
            // so we’ll map using __entity if it exists in rowData:
            onCellEdited: ({ rowIndex, columnName, value, rowData }) => {
            // Prefer stable mapping via __entity if available:
            const entity = rowData?.__entity;
            const stableRowIndex = (entity !== undefined && entityToRowIndex.has(entity))
                ? entityToRowIndex.get(entity)
                : rowIndex;

            roomTable.setValue(stableRowIndex, columnName, value);

            if (columnName === currentColoring.parameterName) {
                refreshColorsFromCurrentChoice();
            }
            },
            // You can also pass tabulatorOptions here if you want:
            // tabulatorOptions: { ... }
        });

      // --------------------------------------------------------------------
      // Initial build + Gradient chooser
      // --------------------------------------------------------------------
      rebuild();

      showGradientChooser({
        parameterNames: ["RoomName", ...parameterNames],
        getValuesForParameter,
        onChange: ({ parameterName, mapValueToColor, mode, order }) => {
          console.log("Color by:", parameterName, "mode:", mode, "order:", order);
          currentColoring.parameterName = parameterName;
          currentColoring.mapValueToColor = mapValueToColor;
          refreshColorsFromCurrentChoice();
        },
        title: "Color Rooms",
      });

      refreshColorsFromCurrentChoice();
    }

    runExample();
  </script>
</body>
</html>
